<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vidda发现X RGB 流量日报填写页">
  <title>填写数据 · Vidda发现X RGB 流量日报</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="index.html"><i class="brand-mark"></i><span>RGB DAILY</span><span>Vidda发现X RGB 流量日报</span></a>
      <nav class="nav" aria-label="页面导航"><a href="index.html">日报展示</a><a class="active" href="edit.html">填写数据</a></nav>
    </div>
  </header>
  <main class="shell editor-wrap">
    <aside class="side-index">
      <div class="card-kicker" style="padding:0 11px 7px">填写目录</div>
      <nav id="section-nav"></nav>
      <div class="side-help">数据只保存在当前浏览器，<b>不会自动同步给别人</b>。填完请点「复制填写链接发回」，把链接发给日报负责人。</div>
    </aside>
    <div class="editor-main">
      <div class="editor-title">
        <div><div class="eyebrow">Data Input</div><h1>填写日报</h1><p class="subtitle" id="t1-hint">本日报采集 T-1 数据</p></div>
        <a class="btn secondary" href="index.html">返回展示页</a>
      </div>
      <form id="report-form"></form>
      <div class="editor-actions">
        <span class="save-state" id="save-state">修改后自动保存</span>
        <div class="actions"><button class="btn danger" type="button" id="reset-btn">清空</button><button class="btn secondary" type="button" id="save-btn">仅保存</button><button class="btn blue" type="button" id="shareback-btn">复制填写链接发回</button><button class="btn secondary" type="button" id="preview-btn">保存并查看</button></div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=20261027d"></script>
  <script>
  /* 本机没有任何填写内容时，自动带入当天归档数据，避免打开是空表 */
  (function () {
    var STORE = 'rgb-daily-report-v1';
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { saved = {}; }
    var base = ['reportDate', 'productName', 'owner', 'stage'];
    var hasContent = Object.keys(saved).some(function (k) {
      return k.charAt(0) !== '_' && base.indexOf(k) < 0 && String(saved[k]).trim() !== '';
    });
    if (location.search.indexOf('d=') >= 0) return;
    var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    var date = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    // 本地存的是今天这份就不覆盖；存的是旧日期则带入归档，避免编辑到过期数据
    if (hasContent && saved.reportDate === date) return;
    // 先试今天的归档，没有则回退到归档最新一期作为底稿（趋势历史随 _trends 一起带入）
    fetch('data/manifest.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { dates: [] }; })
      .catch(function () { return { dates: [] }; })
      .then(function (mf) {
        var dates = (mf.dates || []).slice();
        var order = dates.indexOf(date) >= 0
          ? [date].concat(dates.filter(function (d) { return d !== date; }))
          : dates.slice().reverse();
        if (!order.length) return;
        (function tryNext(i) {
          if (i >= order.length) return;
          fetch('data/' + order[i] + '.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
            .then(function (j) {
              if (!j || !Object.keys(j).length) { tryNext(i + 1); return; }
              localStorage.setItem(STORE, JSON.stringify(Object.assign({}, j, { reportDate: date })));
              location.reload();
            });
        })(0);
      });
  })();
  </script>
</body>
</html>
